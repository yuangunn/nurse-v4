name: Build & Release (Windows + macOS)

# 태그(vX.Y.Z) push 시 Windows·macOS 러너에서 각각 빌드해 설치/포터블 산출물을
# 만들고 해당 태그의 릴리스에 자동 업로드한다.
#   · Windows: build.bat 단계 재현 → Setup .exe + portable.zip
#   · macOS  : build-mac.sh 실행 → .app의 zip + dmg (ad-hoc 서명, 공증 없음)
# 수동 실행(workflow_dispatch)도 지원 — 이미 만든 태그에 자산을 채울 때 사용.
#
# 릴리스 본문은 리포 루트 RELEASE_NOTES.md 로 채운다(body_path) — 버전 올릴 때
# 이 파일도 새 내용으로 갱신할 것 (CLAUDE.md 커밋/릴리즈 정책의 동기화 목록 참조).
#
# Python 3.11 고정(highspy/ortools 휠), Node 20 고정(@electron/packager가 Node 24에서 크래시).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '자산을 업로드할 릴리스 태그 (예: v4.4.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout (대상 태그 소스)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inno Setup 설치
        run: choco install innosetup -y --no-progress

      - name: Python 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: PyInstaller 서버 번들 (dist/NurseScheduler)
        run: python -m PyInstaller NurseScheduler.spec --noconfirm --log-level WARN

      - name: Electron 의존성 설치
        working-directory: electron
        run: npm install

      - name: Electron 패키지 (win32 x64)
        working-directory: electron
        run: >
          npx electron-packager . NurseScheduler
          --platform=win32 --arch=x64 --out=../dist/electron --overwrite
          --app-version=4.0.0 --app-copyright="Hospital Nursing Team"
          --icon=../build/icon.ico --extra-resource=../dist/NurseScheduler

      - name: 포터블 ZIP 생성
        run: Compress-Archive -Path 'dist/electron/NurseScheduler-win32-x64/*' -DestinationPath 'dist/NurseScheduler_v4_portable.zip' -Force

      - name: Inno Setup 설치파일 생성
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'

      - name: 산출물 확인
        run: Get-ChildItem dist/installer/*.exe, dist/NurseScheduler_v4_portable.zip | Select-Object Name, Length

      - name: 릴리스에 자산 업로드 (${{ env.RELEASE_TAG }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/installer/*.exe
            dist/NurseScheduler_v4_portable.zip
          fail_on_unmatched_files: true

  build-mac:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout (대상 태그 소스)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: macOS 빌드 (build-mac.sh → .app/zip/dmg, ad-hoc 서명)
        run: bash build-mac.sh
        env:
          PYTHON: python3

      - name: 산출물 확인
        run: ls -lh dist/NurseScheduler_v4_mac_*.zip dist/NurseScheduler_v4_mac_*.dmg

      - name: 릴리스에 자산 업로드 (${{ env.RELEASE_TAG }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/NurseScheduler_v4_mac_*.zip
            dist/NurseScheduler_v4_mac_*.dmg
          fail_on_unmatched_files: true
