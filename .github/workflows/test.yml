name: Tests

# 회귀 테스트 — push/PR 마다. 빌드·릴리즈와 분리돼 있다.
#
# 왜 붙였나: pytest 워크플로가 없어서 'httpx 미선언' 같은 사고를 아무도 못 잡았다.
# test_nurse_xlsx / test_parse_table_file 이 **실패가 아니라 수집 실패**로 조용히
# 빠져 11건이 안 돌고도 초록으로 보였다 (2026-08-24, requirements-dev.txt 신설).
#
# 범위: pytest 전체 + JS 검증 5종. 여기 있는 것 중 긴 솔버 작업은 없다
# (한 줄로 돌리면 ~5분 — 아래 pytest 는 4개 러너에 나눠 ~2분). 12개월 이월 시뮬 같은 무거운 건
# scripts/sim_chain.py 쪽이고 pytest 밖이라 CI 에 넣지 않는다.
#
# Python 3.11 고정 — highspy/ortools 휠 (release.yml 과 동일).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pytest 는 4개 러너에 나눠 동시에 돈다 (2026-09-28). 한 줄로 돌리면 5분 13초였고
  # 그중 4분 10초가 CP-SAT 테스트 4개(v_report 98초·weekly_of 60초·juhu_block 45초×2)였다.
  # 느린 파일 셋을 한 러너씩 주면 가장 느린 러너 ≈ 2분. xdist 로 한 러너 안에서 나누지
  # 않은 건 CP-SAT 이 코어를 다 쓰기 때문 — 같은 러너에서 겹치면 시간 제한 안에 못 풀 수 있다.
  # 새 테스트 파일은 저절로 'rest' 에 들어간다. 느린 파일이 새로 생기면 그룹을 하나 더 만든다.
  pytest-group:
    name: pytest (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: v_report
            args: tests/test_v_report.py
          - group: constraints
            args: tests/test_constraints.py
          - group: juhu_block
            args: tests/test_juhu_block.py
          - group: rest
            args: >-
              tests
              --ignore=tests/test_v_report.py
              --ignore=tests/test_constraints.py
              --ignore=tests/test_juhu_block.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 수집 확인 (import 오류를 테스트 실패보다 먼저 드러낸다)
        run: python -m pytest --collect-only -q

      - name: pytest
        run: python -m pytest -q --durations=10 ${{ matrix.args }}

  # 예전 체크 이름 'pytest' 를 그대로 남긴다 — 필수 체크로 걸려 있어도 머지가 막히지 않게.
  pytest:
    needs: pytest-group
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 네 그룹이 모두 통과했는지
        run: |
          if [ "${{ needs.pytest-group.result }}" != "success" ]; then
            echo "::error::pytest 그룹 중 실패한 것이 있습니다 (${{ needs.pytest-group.result }})"
            exit 1
          fi

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22+ — 전역 WebSocket(테스트 하네스가 CDP 에 붙는 데 쓴다)이 기본 제공.
      # release.yml 의 Node 20 고정은 @electron/packager 사정이라 여기와 무관하다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS 검증 (외부 패키지 0 — 설치 단계 없음)
        run: |
          node scripts/test_assign_core.mjs
          node scripts/test_paste_dates.mjs
          node scripts/test_preinput_lint.mjs
          node scripts/test_night_badge.mjs
          node scripts/test_charge_plain.mjs
          node scripts/test_hospital_holidays.mjs
          node scripts/test_juhu_rotation.mjs
          node scripts/verify_holidays.mjs

      # 어싸인 원칙 — 배정 엔진을 '모든 배치를 다 따져 본 정답'과 견준다 (원칙 ①~④ 켜고 끄기 16가지 ×
      # 차지 자리 고정/자유 × 주지 않을 방·손 고정·헬퍼 날). 씨앗이 고정이라 늘 같은 결과. docs/verification.md
      - name: 어싸인 원칙 검사 (정답 비교)
        run: node scripts/test_assign_principles.mjs

      # assign.html 계산 로직 — 러너에 깔려 있는 크롬을 그대로 쓴다(설치 단계 없음).
      # 못 찾으면 테스트가 SKIP 으로 빠져나가므로 러너 이미지가 바뀌어도 CI 가 깨지지 않는다.
      - name: standalone 로직 회귀 (헤드리스 크롬)
        run: CHROME=google-chrome node scripts/test_assign_logic.mjs

      # 화면을 실제로 눌러 끝까지 가 본다 — 처음 켜기부터 엑셀 내려받기까지.
      # __app 을 직접 부르는 로직 검사로는 '버튼이 눌리는가'를 볼 수 없다.
      - name: standalone 끝에서 끝까지 (헤드리스 크롬)
        run: CHROME=google-chrome node scripts/test_assign_e2e.mjs

      # 102 오류는 배정표에서 사람을 실시간으로 바꿔도 차지 자리가 안 바뀌는 것으로 드러났다 — 병동 양식 9가지에서
      # 배정표를 실제로 눌러(근무 바꾸기·자리 맞바꾸기·CRN 맡기기·대체간호사·되돌리기…) 고칠 때마다 엔진 규칙과
      # 화면·엑셀·인쇄·하루 어싸인표가 서로 맞는지 본다. 씨앗이 고정이라 늘 같은 순서 — 씨앗 하나로는 CRN 바꾸기가 드물어 셋 (약 80초).
      # docs/verification.md
      - name: standalone 실시간 수정 (병동 양식 9가지)
        run: CHROME=google-chrome node scripts/test_assign_live.mjs --seed 1,2,3

      # 병동은 assign.html 만 바꾸고 데이터 파일은 그대로 쓴다 — 배포했던 버전이 저장한
      # 데이터 파일(tests/fixtures/assign-data/)을 지금 assign.html 로 열어 그대로인지 본다.
      - name: standalone 데이터 파일 호환 (옛 배포본 파일을 새 버전으로)
        run: CHROME=google-chrome node scripts/test_assign_compat.mjs

      # 병동이 주는 양식은 판마다 다르고 한 칸만 서식이 어긋나도 그 자리만 선이 빠진
      # 채 매주 인쇄된다 (122 H18 이 그랬다 — 쓰다가 사람이 알아챘다).
      - name: 배정표 양식 테두리에 구멍이 없는지
        run: python3 scripts/check_form_borders.py

      - name: standalone 빌드가 소스와 동기인지 (버전 문자열만 달라야 한다)
        run: |
          node scripts/build-assign-standalone.mjs
          git diff --stat -- standalone/assign.html
          CHANGED=$(git diff -U0 -- standalone/assign.html \
            | grep -c '^[+-]' | tr -d ' ')
          # 헤더 2줄(+++/---) + 버전 1줄 교체(+/-) = 4
          if [ "$CHANGED" -gt 4 ]; then
            echo "::error::standalone/assign.html 이 코어/양식과 어긋납니다 — node scripts/build-assign-standalone.mjs 를 돌리고 커밋하세요"
            git diff -- standalone/assign.html | head -40
            exit 1
          fi
